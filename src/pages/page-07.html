<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Slide 7 · Why Businesses Trust 48 Hour Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.build.css" />
  <style>
    .trust-card {
      border: 1px solid #E5E7EE;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 1px 0 rgba(31,60,136,0.04);
      width: 218px;
      height: 168px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 12px 14px;
      position: relative;
    }
    .trust-card .icon-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .trust-card .icon-wrap img {
      max-height: 90px;
      max-width: 130px;
      object-fit: contain;
    }
    .trust-card .card-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: #1F3C88;
      text-align: center;
      line-height: 1.15;
    }
  </style>
</head>
<body class="page-shell" data-width="750" data-height="500" data-canvas=".slide-canvas">

  <article class="slide-canvas slide-750x500 relative overflow-hidden">

    <!-- soft bg decoration -->
    <div aria-hidden="true" class="absolute inset-0 pointer-events-none">
      <svg class="absolute -top-[80px] -right-[80px] w-[240px] h-[240px] opacity-[0.08]" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#1F3C88" stroke-width="0.8" />
        <circle cx="100" cy="100" r="62" fill="none" stroke="#1F3C88" stroke-width="0.6" />
      </svg>
      <svg class="absolute -bottom-[100px] -left-[80px] w-[220px] h-[220px] opacity-[0.06]" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#F58B24" stroke-width="0.8" />
      </svg>
    </div>

    <!-- Title -->
    <header class="relative z-10 pt-[18px] px-[20px] text-center">
      <div class="font-body text-[7.5px] uppercase tracking-[0.18em] text-brand-muted leading-none">Trust &amp; Credibility</div>
      <h1 class="font-display font-black leading-[1.0] tracking-tighter2 mt-[4px]" style="font-size: 28px;">
        <span class="text-brand-blue">Why Businesses Trust</span>
        <span style="color:#F58B24;">48 Hour Digital</span>
      </h1>
    </header>

    <!-- Quote bar -->
    <section class="relative z-10 px-[40px] mt-[12px]">
      <div class="rounded-[10px] border border-brand-line bg-white px-[16px] py-[8px] flex items-center gap-[10px]">
        <svg class="w-[18px] h-[18px] shrink-0" viewBox="0 0 24 24" fill="#F58B24">
          <path d="M9 7H5c-1.1 0-2 .9-2 2v6h6V9H5l4-2zm10 0h-4c-1.1 0-2 .9-2 2v6h6V9h-4l4-2z"/>
        </svg>
        <p class="font-display font-bold text-brand-blue leading-[1.2] tracking-tighter2 flex-1" style="font-size: 13.5px;">
          Zero fluff. Just exact metrics and measurable ROI in 48 hours flat.
        </p>
      </div>
    </section>

    <!-- 5 trust cards: 3 on top row, 2 centered on bottom row -->
    <section class="relative z-10 mt-[12px] flex flex-col items-center gap-[10px]">
      <!-- Row 1 -->
      <div class="flex items-stretch gap-[12px]">
        <div class="trust-card">
          <div class="icon-wrap"><img src="../assets/icons/trust/loop.svg" alt="Expert reviewed audits icon" /></div>
          <div class="card-title">Expert-Reviewed<br/>Audits</div>
        </div>
        <div class="trust-card">
          <div class="icon-wrap"><img src="../assets/icons/trust/guys.svg" alt="Team experience icon" /></div>
          <div class="card-title">37+ Years<br/>Experience</div>
        </div>
        <div class="trust-card">
          <div class="icon-wrap"><img src="../assets/icons/trust/security.svg" alt="Money-back guarantee icon" /></div>
          <div class="card-title">Money-Back<br/>Guarantee</div>
        </div>
      </div>
      <!-- Row 2 (centered) -->
      <div class="flex items-stretch gap-[12px]">
        <div class="trust-card">
          <div class="icon-wrap"><img src="../assets/icons/trust/48hour_delivery.svg" alt="48-hour delivery icon" /></div>
          <div class="card-title">48-Hour<br/>Delivery</div>
        </div>
        <div class="trust-card">
          <div class="icon-wrap"><img src="../assets/icons/trust/loop_and_key.svg" alt="Secure checkout icon" /></div>
          <div class="card-title">Secure<br/>Checkout</div>
        </div>
      </div>
    </section>

  </article>

</body>
</html>

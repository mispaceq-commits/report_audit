<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Apex Legal — Website Audit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.build.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #F7F8FC; }
    body { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0; }
    .page-frame {
      width: 794px; height: 1123px; background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    @media (max-width: 820px) {
      .page-frame { width: 100%; height: auto; aspect-ratio: 794 / 1123; }
    }
  </style>
</head>
<body>
  <style>
    .slide-frame-750 {
      width: 750px; height: 500px; background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    @media (max-width: 820px) {
      .slide-frame-750 { width: 100%; height: auto; aspect-ratio: 750 / 500; }
    }
  </style>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-01.html"></iframe></div>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-02.html"></iframe></div>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-03.html"></iframe></div>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-04.html"></iframe></div>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-05.html"></iframe></div>
  <div class="page-frame"><iframe scrolling="no" src="./pages/page-06.html"></iframe></div>
  <div class="slide-frame-750"><iframe scrolling="no" src="./pages/page-08.html"></iframe></div>
</body>
</html>
